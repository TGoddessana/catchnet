<button
  mat-flat-button
  color="primary"
  class="status-trigger"
  [matMenuTriggerFor]="menu"
>
  {{ buttonLabel() }}
  <mat-icon iconPositionEnd svgIcon="arrow_drop_down"></mat-icon>
</button>
<mat-menu #menu="matMenu">
  @for (option of options; track option.value) {
  <button
    mat-menu-item
    (click)="onOptionClick(option.value)"
    [disabled]="option.disabled"
  >
    {{ option.label }} @if (selectedValue() !== undefined) {
    <mat-icon [class.invisible]="!isActive(option.value)" svgIcon="done"></mat-icon>
    }
  </button>
  }
  @if (showResolveInNextRelease()) {
    <mat-divider />
    <button mat-menu-item (click)="onResolveInNextRelease()">
      <span i18n>Resolve in next release</span>
      <mat-icon [class.invisible]="!resolvedInRelease()" svgIcon="done"></mat-icon>
    </button>
  }
</mat-menu>
