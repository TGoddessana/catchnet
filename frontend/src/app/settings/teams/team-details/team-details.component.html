<section class="l-body">
  <nav class="cn-breadcrumb" i18n-aria-label aria-label="Breadcrumb">
    <a routerLink="../" i18n>Teams</a>
    <span aria-hidden="true">/</span>
    <span>#{{ teamSlug() }}</span>
  </nav>
  <header class="cn-title-row cn-team__head">
    <h1 class="cn-page-title">#{{ teamSlug() }}</h1>
  </header>
  <nav
    class="cn-team__tabs"
    mat-tab-nav-bar
    mat-stretch-tabs="false"
    [tabPanel]="tabPanel"
  >
    @for (link of navLinks; track link) {
      <a
        mat-tab-link
        [routerLink]="link.path"
        routerLinkActive
        [active]="rla.isActive"
        #rla="routerLinkActive"
        >{{ link.label }}
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</section>
