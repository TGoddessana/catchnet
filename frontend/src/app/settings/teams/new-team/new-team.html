<h1 mat-dialog-title i18n>New team</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()" id="create-team-form">
  <mat-dialog-content class="mat-typography">
    <mat-error class="error caption-text">
      @for (error of errors(); track error) {
        <span>{{ error }}</span>
      }
    </mat-error>
    <mat-form-field appearance="outline">
      <mat-label i18n>Slug</mat-label>
      <input matInput gtSlugify formControlName="slug" />
      <mat-hint i18n>Letters, numbers, underscores and hyphens</mat-hint>
      @if (slug?.errors?.required) {
        <mat-error>
          <span i18n>Enter a valid slug to create a team</span>
        </mat-error>
      }
      @if (slug?.errors?.pattern) {
        <mat-error>
          <span i18n
            >Use only letters, numbers, underscores and/or hyphens</span
          >
        </mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="closeDialog()" i18n
      >Cancel</button
    >
    <gt-loading-button i18n-buttonText
      id="create-team-submit"
      buttonText="Create team"
      [loading]="loading()"
    >
    </gt-loading-button>
  </mat-dialog-actions>
</form>
